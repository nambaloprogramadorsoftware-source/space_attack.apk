name: Compilar APK Android 2026

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Obter codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias do sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev install-info build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev git ccache openjdk-17-jdk
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Configurar SDK/NDK Android Oficial
      uses: android-actions/setup-android@v4

    - name: Compilar APK com SDK do Sistema
      run: |
        # Aceita todas as licenças do SDK oficial do GitHub antes de começar
        yes | sdkmanager --licenses || true
        
        # Cria as pastas onde o Buildozer espera encontrar o SDK e faz links diretos
        # para o SDK oficial que já está instalado e funciona perfeitamente!
        mkdir -p ~/.buildozer/android/platform
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Executa a compilação de forma segura
        buildozer android debug
