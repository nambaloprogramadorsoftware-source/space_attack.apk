name: Compilar APK Android 2026

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Obter codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java 17 (Obrigatorio)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias do sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev install-info build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev git ccache unzip
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Preparar SDK e cmdline-tools para o Buildozer
      run: |
        # Cria a estrutura exata de pastas que o Buildozer usa internamente
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # Descarrega as ferramentas oficiais e estáveis diretamente da Google
        wget https://google.com -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # O Buildozer procura pela pasta antiga 'tools', por isso criamos um atalho correto
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Aceita antecipadamente todas as licenças do Android
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

    - name: Compilar APK com Buildozer
      run: |
        # Executa a compilação garantindo que respostas automatizadas sejam enviadas
        yes | buildozer android debug
      env:
        ACCEPT_BUILD_TOOLS_LICENSES: 'y'

    - name: Disponibilizar ficheiro APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: EbenesisGamer-APK
        path: bin/*.apk
