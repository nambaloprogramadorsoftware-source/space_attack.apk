name: Compilar APK Android 2026

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Obter codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias do sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev install-info build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev git ccache openjdk-17-jdk
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Configurar SDK/NDK Android
      uses: android-actions/setup-android@v4

    - name: Compilar APK aceitando licenças automaticamente
      run: |
        # Este comando cria as pastas e aceita as licenças onde o Buildozer vai procurar
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb7437c3550b3118bca0\n24333f1a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # Executa a compilação enviando "y" (sim) para qualquer pergunta que surgir no terminal
        yes | buildozer android debug
      env:
        ACCEPT_BUILD_TOOLS_LICENSES: 'y'

    - name: Disponibilizar ficheiro APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: EbenesisGamer-APK
        path: bin/*.apk
