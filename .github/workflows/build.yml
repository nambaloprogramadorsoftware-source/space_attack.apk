name: Compilar APK Android 2026

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Obter codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java 17 (Obrigatório)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias do sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev install-info build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev git ccache
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Compilar APK com Buildozer
      run: |
        # Aceita as licenças do SDK que já vem nativo no GitHub
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Conecta o Buildozer diretamente ao SDK nativo do servidor
        mkdir -p ~/.buildozer/android/platform
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Inicia a compilação do APK
        yes | buildozer android debug
      env:
        ACCEPT_BUILD_TOOLS_LICENSES: 'y'

    - name: Disponibilizar ficheiro APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: EbenesisGamer-APK
        path: bin/*.apk
