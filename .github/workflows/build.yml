name: Compilar APK Android 2026

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Obter codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java 17 (Obrigatorio)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias do sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev install-info build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev git ccache
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Compilar APK com Buildozer Nativo
      run: |
        # Aceita todas as licenças do SDK padrão do GitHub Actions
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Executa a compilação injetando os caminhos corretos e forçando o Buildozer a aceitar
        yes | buildozer android debug
      env:
        ACCEPT_BUILD_TOOLS_LICENSES: 'y'
        BUILDOZER_ANDROID_SDK_PATH: '/usr/local/lib/android/sdk'
        BUILDOZER_ANDROID_NDK_PATH: '/usr/local/lib/android/sdk/ndk-bundle'
